services:
  python-app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: spreadsheet-ai
    mem_limit: 1g
    cpus: 1.0
    cap_drop:
      - ALL
    user: 1000:1000
    security_opt:
      - no-new-privileges:true
    read_only: true
    network_mode: none
    env_file:
      - .env
    volumes:
      - ./data:/app/data

    environment:
      WORKING_SPREADSHEET_NAME: ${WORKING_SPREADSHEET_NAME}
    restart: none
